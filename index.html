<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAP-FGIMqtUEfB5l2XpQJBzzh0vzJxmEnc",
  authDomain: "digital-marketing-9a292.firebaseapp.com",
  projectId: "digital-marketing-9a292",
  storageBucket: "digital-marketing-9a292.firebasestorage.app",
  messagingSenderId: "225145075712",
  appId: "1:225145075712:web:4ba3a063f1ca57635c40e5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ═══════════════════════════════════════════════════════════
   ✅ Payment Numbers এখন Admin Panel থেকে control হবে
   ═══════════════════════════════════════════════════════════ */
const SETTINGS_ID = 'SHs2asLtF8dhPipVE4GVvCCTTQC2';
const SESSION_KEY = 'smm_user_id_v2';
const LOGIN_TIME_KEY = 'smm_login_time_v2';
const SESSION_MAX_AGE = 30 * 24 * 60 * 60 * 1000;

const FS = {
  async getAll(col) {
    const snap = await getDocs(collection(db, col));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async getOne(col, id) {
    const snap = await getDoc(doc(db, col, id));
    return snap.exists() ? { id: snap.id, ...snap.data() } : null;
  },
  async set(col, id, data) { return await setDoc(doc(db, col, id), data, { merge: true }); },
  async update(col, id, data) { return await updateDoc(doc(db, col, id), data); },
  async remove(col, id) { return await deleteDoc(doc(db, col, id)); },
  async findBy(col, field, value) {
    const q = query(collection(db, col), where(field, '==', value));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
};

let CURRENT_USER = null;
let SETTINGS = {
  panel_name: 'SMM Panel',
  currency: '৳',
  bkash: '',
  nagad: '',
  rocket: '',
  instruction: ''
};
let allServicesCache = [];

window.toast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
};

window.toggleSidebar = function() {
  const s = document.getElementById('sidebar');
  const o = document.getElementById('sidebarOverlay');
  s.classList.toggle('-translate-x-full');
  o.classList.toggle('hidden');
};

/* ================= SESSION HELPERS ================= */
function saveSession(userId) {
  try {
    localStorage.setItem(SESSION_KEY, userId);
    localStorage.setItem(LOGIN_TIME_KEY, Date.now().toString());
  } catch (e) { console.error('Session save failed', e); }
}

function getSession() {
  try {
    const id = localStorage.getItem(SESSION_KEY);
    const time = localStorage.getItem(LOGIN_TIME_KEY);
    if (!id || !time) return null;
    const age = Date.now() - parseInt(time);
    if (age > SESSION_MAX_AGE) {
      clearSession();
      return null;
    }
    return id;
  } catch (e) { return null; }
}

function clearSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(LOGIN_TIME_KEY);
  } catch (e) {}
}

/* ================= INIT ================= */
async function init() {
  try {
    // ✅ Firebase থেকে SETTINGS load (Payment Numbers সহ)
    const s = await FS.getOne('settings', SETTINGS_ID);
    if (s) SETTINGS = { ...SETTINGS, ...s };

    document.getElementById('loading').classList.add('hidden');

    const savedUserId = getSession();
    if (savedUserId) {
      const u = await FS.getOne('users', savedUserId);
      if (u && u.status !== 'blocked') {
        enterUserPanel(u);
        return;
      } else {
        clearSession();
      }
    }
    document.getElementById('authPage').classList.remove('hidden');
  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML = `<div class="text-white text-center p-8">
      <i class="fas fa-exclamation-triangle text-4xl mb-3"></i>
      <p class="font-bold">Firebase Error</p>
      <p class="text-sm mt-2">${err.message}</p>
    </div>`;
  }
}

function cur() { return SETTINGS.currency || '৳'; }

window.switchAuth = function(mode) {
  const forms = { login: 'loginForm', register: 'registerForm', forgot: 'forgotForm' };
  Object.values(forms).forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById(forms[mode]).classList.remove('hidden');
  document.getElementById('authError').classList.add('hidden');

  const titles = { login: 'User Login', register: 'Create Account', forgot: 'Reset Password' };
  document.getElementById('authTitle').textContent = titles[mode];

  document.getElementById('tabLogin').className = `flex-1 py-2 rounded-md text-sm font-semibold ${mode === 'login' ? 'bg-white shadow' : 'text-slate-500'}`;
  document.getElementById('tabRegister').className = `flex-1 py-2 rounded-md text-sm font-semibold ${mode === 'register' ? 'bg-white shadow' : 'text-slate-500'}`;
};

function authError(msg) {
  const e = document.getElementById('authError');
  e.textContent = '❌ ' + msg;
  e.classList.remove('hidden');
}

window.handleUserLogin = async function(e) {
  e.preventDefault();
  const login = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Logging in...';

  try {
    let users = await FS.findBy('users', 'username', login);
    if (!users.length) users = await FS.findBy('users', 'email', login);

    if (!users.length) { authError('User পাওয়া যায়নি!'); return; }
    const u = users[0];
    if (u.password !== pass) { authError('ভুল Password!'); return; }
    if (u.status === 'blocked') { authError('আপনার account blocked!'); return; }

    saveSession(u.id);
    enterUserPanel(u);
  } catch (err) {
    authError(err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Login';
  }
};

window.handleUserRegister = async function(e) {
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim();
  const email = f.email.value.trim();
  const password = f.password.value;

  try {
    const existingU = await FS.findBy('users', 'username', username);
    if (existingU.length) return authError('Username ইতিমধ্যে ব্যবহৃত!');
    const existingE = await FS.findBy('users', 'email', email);
    if (existingE.length) return authError('Email ইতিমধ্যে ব্যবহৃত!');

    const userId = 'user_' + Date.now();
    await FS.set('users', userId, {
      username, email, password,
      balance: 0, status: 'active',
      joined: new Date().toISOString().slice(0, 10),
      reseller: false, api_key: ''
    });

    toast('✅ Registration successful!');
    switchAuth('login');
    document.getElementById('loginUser').value = username;
    document.getElementById('loginPass').value = '';
  } catch (err) {
    authError(err.message);
  }
};

window.handleForgot = async function(e) {
  e.preventDefault();
  const email = e.target.email.value.trim();
  const users = await FS.findBy('users', 'email', email);
  if (!users.length) return authError('এই email-এ account নেই!');
  toast('📧 Reset link sent (demo)');
  switchAuth('login');
};

window.userLogout = function() {
  if (!confirm('Logout করবেন?')) return;
  clearSession();
  location.reload();
};

function enterUserPanel(user) {
  CURRENT_USER = user;
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('userPanel').classList.remove('hidden');
  document.getElementById('sidebarTitle').textContent = SETTINGS.panel_name || 'SMM Panel';
  document.getElementById('topUsername').textContent = user.username;
  refreshSidebar();
  showUP('dashboard');
}

async function refreshSidebar() {
  const u = await FS.getOne('users', CURRENT_USER.id);
  if (u) CURRENT_USER = u;
  document.getElementById('sidebarUser').textContent = CURRENT_USER.username;
  document.getElementById('sidebarBalance').textContent = cur() + (CURRENT_USER.balance || 0);
  document.getElementById('topUsername').textContent = CURRENT_USER.username;

  const notifs = await FS.getAll('notifications');
  const myNotifs = notifs.filter(n => n.target === 'all' || n.target === CURRENT_USER.username);
  const seen = parseInt(localStorage.getItem('smm_seen_notifs_v2') || '0');
  document.getElementById('notifDot').classList.toggle('hidden', myNotifs.length <= seen);
}

window.showUP = async function(page) {
  document.querySelectorAll('.up-nav').forEach(el => {
    el.classList.toggle('bg-orange-50', el.dataset.up === page);
    el.classList.toggle('text-brand', el.dataset.up === page);
    el.classList.toggle('font-semibold', el.dataset.up === page);
  });
  const c = document.getElementById('upContent');
  c.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin text-2xl text-brand"></i></div>';
  c.classList.remove('fade-in'); void c.offsetWidth; c.classList.add('fade-in');

  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  }

  // ✅ প্রতি পেজ লোডে Settings refresh করুন (Payment Numbers update এর জন্য)
  try {
    const s = await FS.getOne('settings', SETTINGS_ID);
    if (s) SETTINGS = { ...SETTINGS, ...s };
  } catch (e) { console.warn('Settings refresh failed', e); }

  await refreshSidebar();
  const pages = {
    dashboard: upDashboard, neworder: upNewOrder, myorders: upMyOrders,
    addfunds: upAddFunds, transactions: upTransactions, notifications: upNotifications,
    support: upSupport, reseller: upReseller, profile: upProfile
  };
  await pages[page]();
};

function badge(status) {
  const map = {
    pending: 'bg-yellow-100 text-yellow-700',
    processing: 'bg-blue-100 text-blue-700',
    completed: 'bg-emerald-100 text-emerald-700',
    failed: 'bg-red-100 text-red-700',
    cancelled: 'bg-slate-200 text-slate-700',
    approved: 'bg-emerald-100 text-emerald-700',
    rejected: 'bg-red-100 text-red-700',
    active: 'bg-emerald-100 text-emerald-700',
    blocked: 'bg-red-100 text-red-700',
    open: 'bg-blue-100 text-blue-700',
    closed: 'bg-slate-200 text-slate-600'
  };
  return `<span class="px-2 py-1 rounded-full text-xs font-semibold capitalize ${map[status] || 'bg-slate-100'}">${status}</span>`;
}

function renderPlatformGrid() {
  return `
    <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-orange-100">
      <div class="grid grid-cols-6 gap-2">

window.searchServices = function(query) {
  const services = allServicesCache;
  const q = (query || '').toLowerCase().trim();
  
  const clearBtn = document.getElementById('clearSearchBtn');
  if (clearBtn) clearBtn.classList.toggle('hidden', !q);

  const filtered = q
    ? services.filter(s =>
        (s.name || '').toLowerCase().includes(q) ||
        (s.category || '').toLowerCase().includes(q)
      )
    : services;

  const sel = document.getElementById('orderService');
  if (!sel) return;

  if (!filtered.length) {
    sel.innerHTML = '<option value="">❌ No services found</option>';
    document.getElementById('serviceDetails').classList.add('hidden');
    return;
  }

  sel.innerHTML = filtered.map(s =>
    `<option value="${s.id}">#${s.id.slice(-4)} - ${s.name} [${cur()}${s.price}]</option>`
  ).join('');

  if (filtered.length >= 1) showServiceDetails();
};

window.clearSearch = function() {
  const input = document.getElementById('orderSearch');
  if (input) input.value = '';
  searchServices('');
  document.getElementById('orderCategory').value = '';
  document.getElementById('orderService').innerHTML = '<option value="">-- Select Category First --</option>';
  document.getElementById('serviceDetails').classList.add('hidden');
};

window.filterServices = async function() {
  const cat = document.getElementById('orderCategory').value;
  const searchInput = document.getElementById('orderSearch');
  if (searchInput) searchInput.value = '';
  const clearBtn = document.getElementById('clearSearchBtn');
  if (clearBtn) clearBtn.classList.add('hidden');

  const services = allServicesCache.filter(s => !cat || s.category === cat);
  const sel = document.getElementById('orderService');
  
  if (!cat) {
    sel.innerHTML = '<option value="">-- Select Category First --</option>';
    document.getElementById('serviceDetails').classList.add('hidden');
    return;
  }

  sel.innerHTML = services.length
    ? services.map(s => `<option value="${s.id}">#${s.id.slice(-4)} - ${s.name} [${cur()}${s.price}]</option>`).join('')
    : '<option value="">No services in this category</option>';
  showServiceDetails();
};

window.showServiceDetails = async function() {
  const id = document.getElementById('orderService').value;
  if (!id) return document.getElementById('serviceDetails').classList.add('hidden');
  const s = await FS.getOne('services', id);
  if (!s) return;
  document.getElementById('serviceDetails').classList.remove('hidden');
  document.getElementById('svcPrice').textContent = cur() + s.price;
  document.getElementById('svcMin').textContent = s.min;
  document.getElementById('svcMax').textContent = s.max;
  document.getElementById('hintMin').textContent = s.min;
  document.getElementById('hintMax').textContent = s.max;
  calcCharge();
};

window.calcCharge = async function() {
  const id = document.getElementById('orderService').value;
  if (!id) return;
  const s = await FS.getOne('services', id);
  const qty = parseInt(document.getElementById('orderQty').value) || 0;
  const charge = s ? (qty / 1000) * s.price : 0;
  document.getElementById('orderCharge').textContent = cur() + charge.toFixed(2);
};

window.placeOrder = async function() {
  const id = document.getElementById('orderService').value;
  if (!id) return toast('❌ Select a service!');
  const s = await FS.getOne('services', id);
  const link = document.getElementById('orderLink').value.trim();
  const qty = parseInt(document.getElementById('orderQty').value) || 0;

  if (!link) return toast('❌ Link required!');
  if (qty < s.min || qty > s.max) return toast(`❌ Quantity ${s.min}-${s.max}!`);

  const charge = (qty / 1000) * s.price;
  if (charge > (CURRENT_USER.balance || 0)) return toast('❌ Insufficient balance!');

  try {
    await FS.update('users', CURRENT_USER.id, { balance: (CURRENT_USER.balance || 0) - charge });
    CURRENT_USER.balance = (CURRENT_USER.balance || 0) - charge;

    const orderId = 'ord_' + Date.now();
    const orderNum = 1000 + Math.floor(Math.random() * 9000);
    await FS.set('orders', orderId, {
      orderId: orderNum,
      user: CURRENT_USER.username,
      userId: CURRENT_USER.id,
      service: s.name,
      serviceId: s.id,
      link, qty,
      charge: parseFloat(charge.toFixed(2)),
      status: 'pending',
      date: new Date().toISOString().slice(0, 10),
      createdAt: Date.now()
    });

    toast(`✅ Order #${orderNum} placed!`);
    showUP('myorders');
  } catch (err) {
    toast('❌ ' + err.message);
  }
};

window.copyNumber = function(num) {
  const el = document.createElement('textarea');
  el.value = num;
  document.body.appendChild(el);
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
  toast('📋 Copied: ' + num);
};

window.submitDeposit = async function(e) {
  e.preventDefault();

    await FS.set('payments', payId, {

      userId: CURRENT_USER.id,
      method: f.method.value,
      txn: f.txn.value,
      sender: f.sender.value,
      amount: parseFloat(f.amount.value),

      date: new Date().toISOString().slice(0, 10),

};

window.newTicketForm = function() {
  openModal(`
    <div class="p-6">
      <h2 class="text-xl font-bold mb-4 text-brand">Create New Ticket</h2>
      <form onsubmit="createTicket(event)" class="space-y-3">
        <input name="subject" placeholder="Subject" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand focus:outline-none">
        <textarea name="msg" placeholder="Describe your issue..." required rows="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand focus:outline-none"></textarea>
        <div class="flex gap-2">
          <button type="submit" class="flex-1 bg-brand-solid text-white py-3 rounded-xl font-bold">Submit</button>
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-200 py-3 rounded-xl font-bold">Cancel</button>
        </div>
      </form>
    </div>
  `);
};

window.createTicket = async function(e) {
  e.preventDefault();
  try {
    const ticketId = 'tkt_' + Date.now();
    const ticketNum = Math.floor(Math.random() * 9000) + 1000;
    await FS.set('tickets', ticketId, {
      ticketId: ticketNum,
      user: CURRENT_USER.username,
      userId: CURRENT_USER.id,
      subject: e.target.subject.value,
      status: 'open',
      date: new Date().toISOString().slice(0, 10),
      createdAt: Date.now(),
      replies: [{ sender: 'user', msg: e.target.msg.value, time: new Date().toLocaleTimeString() }]
    });
    toast('✅ Ticket created!');
    closeModal();
    upSupport();
  } catch (err) {
    toast('❌ ' + err.message);
  }
};

window.userViewTicket = async function(id) {
  const t = await FS.getOne('tickets', id);
  const replies = t.replies || [];
  openModal(`
    <div class="p-6">
      <h2 class="text-xl font-bold mb-1 text-brand">#${t.ticketId || id.slice(-6)} - ${t.subject}</h2>
      <p class="text-sm text-slate-500 mb-4">${badge(t.status)}</p>
      <div class="bg-slate-50 rounded-xl p-3 max-h-64 overflow-y-auto mb-4 space-y-3">
        ${replies.map(r => `
          <div class="${r.sender === 'user' ? 'text-right' : ''}">
            <span class="inline-block px-3 py-2 rounded-lg text-sm ${r.sender === 'user' ? 'bg-brand-solid text-white' : 'bg-white border'}">
              <b>${r.sender === 'admin' ? 'Admin' : 'You'}:</b> ${r.msg}
            </span>
            <p class="text-xs text-slate-400 mt-1">${r.time}</p>
          </div>
        `).join('')}
      </div>
      ${t.status === 'open' ? `
        <form onsubmit="userReplyTicket(event, '${t.id}')">
          <textarea name="msg" placeholder="Reply..." required rows="3" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-brand focus:outline-none mb-2"></textarea>
          <button type="submit" class="w-full bg-brand-solid text-white py-3 rounded-xl font-bold">Send</button>
        </form>
      ` : '<p class="text-center text-slate-400 py-2">🔒 Ticket closed</p>'}
      <button onclick="closeModal()" class="mt-3 w-full bg-slate-200 py-2 rounded-lg">Close</button>
    </div>
  `);
};

window.userReplyTicket = async function(e, id) {
  e.preventDefault();
  const t = await FS.getOne('tickets', id);
  const replies = t.replies || [];
  replies.push({ sender: 'user', msg: e.target.msg.value, time: new Date().toLocaleTimeString() });
  await FS.update('tickets', id, { replies });
  toast('✅ Reply sent!');
  userViewTicket(id);
};

window.applyReseller = async function() {
  if (!confirm('Reseller হতে চান?')) return;
  const apiKey = 'API-' + CURRENT_USER.username.toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  await FS.update('users', CURRENT_USER.id, { reseller: true, api_key: apiKey });
  CURRENT_USER.reseller = true;
  CURRENT_USER.api_key = apiKey;
  toast('✅ Reseller activated!');
  upReseller();
};

window.copyApiKey = function() {
  const field = document.getElementById('apiKeyField');
  field.select();
  document.execCommand('copy');
  toast('📋 API Key copied!');
};

window.regenApiKey = async function() {

  const apiKey = 'API-' + CURRENT_USER.username.toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  await FS.update('users', CURRENT_USER.id, { api_key: apiKey });
  CURRENT_USER.api_key = apiKey;
  toast('🔄 API Key regenerated!');
  upReseller();
};

window.changePassword = async function(e) {
  e.preventDefault();
  const f = e.target;
  if (CURRENT_USER.password !== f.old.value) return toast('❌ Current password wrong!');
  if (f.new1.value !== f.new2.value) return toast('❌ Passwords do not match!');
  await FS.update('users', CURRENT_USER.id, { password: f.new1.value });
  CURRENT_USER.password = f.new1.value;
  toast('✅ Password updated!');
  f.reset();
};

window.openModal = function(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
};
window.closeModal = function() {
  document.getElementById('modal').classList.add('hidden');
};
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

window.showForgot = function(e) { e.preventDefault(); switchAuth('forgot'); };
